# Local services for development and tests: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres }
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data', './apps/api/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro']
volumes:
  pgdata:
